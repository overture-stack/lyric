# Description of Submission API

/submission/{submissionId}:
  get:
    summary: Get submission information by ID
    tags:
      - Submission
    parameters:
      - name: submissionId
        in: path
        type: string
        required: true
    responses:
      200:
        description: Submission information
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmissionResult'

      401:
        $ref: '#/components/responses/UnauthorizedError'
      404:
        $ref: '#/components/responses/NotFound'
      500:
        $ref: '#/components/responses/ServerError'
      503:
        $ref: '#/components/responses/ServiceUnavailableError'

  delete:
    summary: Close an Active Submission by ID
    tags:
      - Submission
    parameters:
      - $ref: '#/components/parameters/path/SubmissionId'
      - $ref: '#/components/parameters/query/ForceDeleteSubmission'
    responses:
      200:
        description: Submission closed successfully
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteSubmissionResult'
      400:
        $ref: '#/components/responses/BadRequest'
      401:
        $ref: '#/components/responses/UnauthorizedError'
      404:
        $ref: '#/components/responses/NotFound'
      409:
        $ref: '#/components/responses/StatusConflict'
      500:
        $ref: '#/components/responses/ServerError'
      503:
        $ref: '#/components/responses/ServiceUnavailableError'

/submission/{submissionId}/data:
  get:
    summary: Fetch a paginated list of Submission Data records, ordered by record ID (the order they were added to the Submission).
    tags:
      - Submission
    parameters:
      - $ref: '#/components/parameters/path/SubmissionId'
      - name: actionTypes
        in: query
        schema:
          type: array
          items:
            type: string
            enum: [insert, update, delete]
        uniqueItems: true
        description: Filters the Submission Data records by action type. Valid values are `insert`, `update`, and `delete` (case insensitive). If not provided, all action types are returned.
      - name: entityNames
        in: query
        schema:
          type: array
          items:
            type: string
        uniqueItems: true
        description: Filters the Submission Data records by entity name. Must match schema names in the Submission's dictionary. If not provided, all entity names are returned.
      - name: fileId
        in: query
        required: false
        schema:
          type: integer
        description: An optional query parameter used to specify the file ID within the submission to be retrieved.
      - $ref: '#/components/parameters/query/Page'
      - $ref: '#/components/parameters/query/PageSize'
    responses:
      200:
        description: Paginated Submission Data records
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmissionDetailsResult'
      400:
        $ref: '#/components/responses/BadRequest'
      401:
        $ref: '#/components/responses/UnauthorizedError'
      500:
        $ref: '#/components/responses/ServerError'
      503:
        $ref: '#/components/responses/ServiceUnavailableError'

  delete:
    summary: Remove a single record, or a file and all of its records, from an Active Submission. The Active Submission is then validated again in the background.
    tags:
      - Submission
    parameters:
      - $ref: '#/components/parameters/path/SubmissionId'
      - name: recordId
        in: query
        required: false
        schema:
          type: integer
        description: The ID of the record to remove from the Submission. Removing a parent record (an `idFieldChange` update, or a delete staged by system ID) also removes the records staged as its consequence; a consequence record (with `parentRecord` set) cannot be removed on its own and returns 400. <br />Exactly one of `recordId` or `fileId` must be provided.
      - name: fileId
        in: query
        required: false
        schema:
          type: integer
        description: The ID of the file to remove from the Submission, along with all of its records. When the file contains a parent record or any of its consequence records, the whole group is removed, including its records in other files. <br />Exactly one of `recordId` or `fileId` must be provided.
    responses:
      200:
        description: Removal accepted. Validation of the Active Submission runs in the background.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteSubmissionEntityResult'
      400:
        $ref: '#/components/responses/BadRequest'
      401:
        $ref: '#/components/responses/UnauthorizedError'
      409:
        $ref: '#/components/responses/StatusConflict'
      500:
        $ref: '#/components/responses/ServerError'
      503:
        $ref: '#/components/responses/ServiceUnavailableError'

/submission/category/{categoryId}:
  get:
    summary: Retrieve the Submissions for a category in this user session
    tags:
      - Submission
    parameters:
      - $ref: '#/components/parameters/path/CategoryId'
      - $ref: '#/components/parameters/query/Page'
      - $ref: '#/components/parameters/query/PageSize'
      - $ref: '#/components/parameters/query/OnlyActive'
      - $ref: '#/components/parameters/query/OrganizationFilter'
      - $ref: '#/components/parameters/query/Username'
    responses:
      200:
        description: List of Submissions
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListSubmissionsResult'

      401:
        $ref: '#/components/responses/UnauthorizedError'
      404:
        $ref: '#/components/responses/NotFound'
      500:
        $ref: '#/components/responses/ServerError'
      503:
        $ref: '#/components/responses/ServiceUnavailableError'

/submission/category/{categoryId}/commit/{submissionId}:
  post:
    summary: Commit Active Submission
    tags:
      - Submission
    parameters:
      - $ref: '#/components/parameters/path/CategoryId'
      - name: submissionId
        in: path
        type: string
        required: true
    responses:
      200:
        description: Commit Submission Result
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommitSubmissionResult'
      400:
        $ref: '#/components/responses/BadRequest'
      401:
        $ref: '#/components/responses/UnauthorizedError'
      409:
        $ref: '#/components/responses/StatusConflict'
      500:
        $ref: '#/components/responses/ServerError'
      503:
        $ref: '#/components/responses/ServiceUnavailableError'

/submission/category/{categoryId}/data:
  post:
    summary: Add new data to a submission for the specified category. Data is provided as JSON in the request body.
    tags:
      - Submission
    parameters:
      - $ref: '#/components/parameters/path/CategoryId'
      - $ref: '#/components/parameters/query/EntityName'
      - $ref: '#/components/parameters/query/Organization'
    requestBody:
      description: The JSON payload containing the data to be added to the submission
      required: true
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
    responses:
      200:
        description: Submission accepted
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubmissionResult'
      400:
        $ref: '#/components/responses/BadRequest'
      401:
        $ref: '#/components/responses/UnauthorizedError'
      500:
        $ref: '#/components/responses/ServerError'
      503:
        $ref: '#/components/responses/ServiceUnavailableError'
  put:
    summary: Modifies existing data for a submission.  Data is provided as JSON in the request body.
    description: |
      Each record must include its `systemId` and the full record. An edit that changes an ID field is staged as an
      update with `idFieldChange` set, plus the records that apply it, linked to it through `parentRecord`: the delete
      of the original record, the insert of its replacement, and the foreign key updates of its dependents.

      Rules:
      - **Replacement.** Each record replaces the change already staged for the same `systemId` in the Active
        Submission: an update, an ID field change with its linked records, or a delete with its dependents' deletes.
        Within one request, the last record with a given `systemId` wins.
      - **`replacedRecords`.** The response lists the staged changes that were discarded. These are removed from the
        submission only; submitted data does not change until the submission is committed. Linked records removed with
        them are not listed.
      - **Conflicts.** The request is rejected with `409` when a record targets a record staged as a consequence of
        another change, or when one of its foreign key updates targets a record that is already staged.
      - **Whole request.** A conflict, or a submission status that does not allow changes (such as `VALIDATING` or
        `COMMITTING`), rejects the whole request and nothing from it is staged.

      Staging is synchronous: the response is sent once the records are staged, and only validation runs in the
      background. A batch of ID field changes whose records have many dependents can take a while to respond.
    tags:
      - Submission
    parameters:
      - $ref: '#/components/parameters/path/CategoryId'
      - $ref: '#/components/parameters/query/EntityName'
      - $ref: '#/components/parameters/query/Organization'
    requestBody:
      description: The JSON payload containing the data to be added to the submission
      required: true
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
    responses:
      200:
        description: Edits staged; validation runs in the background
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditSubmittedDataResult'
      400:
        $ref: '#/components/responses/BadRequest'
      401:
        $ref: '#/components/responses/UnauthorizedError'
      409:
        $ref: '#/components/responses/StagingConflict'
      500:
        $ref: '#/components/responses/ServerError'
      503:
        $ref: '#/components/responses/ServiceUnavailableError'

/submission/category/{categoryId}/files:
  post:
    summary: Add new data to a submission for the specified category. An optional filename-to-entity map can be provided to control which entity each file is submitted for, enabling multiple files for the same entity and files whose names do not match the entity name.
    tags:
      - Submission
    parameters:
      - $ref: '#/components/parameters/path/CategoryId'
      - $ref: '#/components/parameters/query/Organization'
      - name: sync
        in: query
        required: false
        schema:
          type: string
          enum: [true, false]
          default: 'false'
        description: >
          Controls whether file parsing is synchronous. When `false` (default), parsing runs in the
          background and `fileResults` will be empty in the response. When `true`, the response waits
          for all files to be parsed and returns per-file results in `fileResults`.

          **Warning:** Using `sync=true` on very large batches may cause the request to time out before
          the response is returned. Monitor server logs for parse errors when using the default async mode.
    requestBody:
      description: File(s) to be added to the submission, with an optional mapping of filenames to entity names.
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required:
              - files
            properties:
              files:
                type: array
                items:
                  type: string
                  format: binary
              fileEntityMap:
                type: array
                description: Optional mapping of uploaded filenames to entity names. When provided, each file is matched to its entity using this map. When omitted, each file's name (without extension) must match an entity name in the dictionary.
                items:
                  $ref: '#/components/schemas/FilenameEntityPair'
          encoding:
            fileEntityMap:
              contentType: application/json
    responses:
      200:
        description: Submission accepted
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubmissionResult'
      400:
        $ref: '#/components/responses/BadRequest'
      401:
        $ref: '#/components/responses/UnauthorizedError'
      500:
        $ref: '#/components/responses/ServerError'
      503:
        $ref: '#/components/responses/ServiceUnavailableError'

/submission/category/{categoryId}/data/{systemId}:
  delete:
    summary: Removes data from a submission using the System ID. Returns an Active Submission containing the records that will be deleted
    description: |
      Stages a delete of the record and deletes of every record that depends on it. The record's delete is the parent;
      the dependents' deletes are linked to it through `parentRecord`, so removing or replacing it removes them too.

      Rules:
      - **Replacement.** The delete replaces the change already staged for the same `systemId`: an update, an ID field
        change with its linked records, or another delete with its dependents' deletes.
      - **Already staged.** Deleting a record that already has a delete staged, directly or as a dependent of another
        delete, changes nothing. A dependent that already has a delete staged is skipped.
      - **`replacedRecords`.** The response lists the staged changes that were discarded. These are removed from the
        submission only; submitted data does not change until the submission is committed. Linked records removed with
        them are not listed.
      - **Conflicts.** The request is rejected with `409` when the record, or one of its dependents, is already staged
        as anything other than a delete that the request does not replace.
      - **Whole request.** A conflict, or a submission status that does not allow changes, rejects the whole request
        and nothing from it is staged.
    tags:
      - Submission
    parameters:
      - $ref: '#/components/parameters/path/CategoryId'
      - name: systemId
        in: path
        required: true
        schema:
          type: string
        description: The unique system ID of the data to be deleted
    responses:
      200:
        description: Deletes staged; validation runs in the background
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteSubmittedDataResult'
      400:
        $ref: '#/components/responses/BadRequest'
      401:
        $ref: '#/components/responses/UnauthorizedError'
      404:
        $ref: '#/components/responses/NotFound'
      409:
        $ref: '#/components/responses/StagingConflict'
      500:
        $ref: '#/components/responses/ServerError'
      503:
        $ref: '#/components/responses/ServiceUnavailableError'
