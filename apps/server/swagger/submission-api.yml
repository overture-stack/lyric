# Description of Submission API

/submission/{submissionId}:
  get:
    summary: Get submission information by ID
    tags:
      - Submission
    parameters:
      - $ref: '#/components/parameters/path/SubmissionId'
    responses:
      200:
        description: Submission information
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmissionResult'
      400:
        $ref: '#/components/responses/BadRequest'
      401:
        $ref: '#/components/responses/UnauthorizedError'
      403:
        $ref: '#/components/responses/Forbidden'
      404:
        $ref: '#/components/responses/NotFound'
      500:
        $ref: '#/components/responses/ServerError'
      503:
        $ref: '#/components/responses/ServiceUnavailableError'

  delete:
    summary: Close an Active Submission by ID
    tags:
      - Submission
    parameters:
      - $ref: '#/components/parameters/path/SubmissionId'
      - $ref: '#/components/parameters/query/ForceDeleteSubmission'
    responses:
      200:
        description: Submission closed successfully
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteSubmissionResult'
      400:
        description: The request is invalid, or the Submission was not found
        content:
          application/json:
            schema:
              $ref: '#/components/responses/Error'
      401:
        $ref: '#/components/responses/UnauthorizedError'
      403:
        $ref: '#/components/responses/Forbidden'
      409:
        $ref: '#/components/responses/StatusConflict'
      500:
        $ref: '#/components/responses/ServerError'
      503:
        $ref: '#/components/responses/ServiceUnavailableError'

/submission/{submissionId}/data:
  get:
    summary: Fetch a paginated list of Submission Data records, ordered by record ID (the order they were added to the Submission).
    tags:
      - Submission
    parameters:
      - $ref: '#/components/parameters/path/SubmissionId'
      - name: actionTypes
        in: query
        schema:
          type: array
          items:
            type: string
            enum: [insert, update, delete]
          uniqueItems: true
        description: Filters the Submission Data records by action type. Valid values are `insert`, `update`, and `delete` (case insensitive). If not provided, all action types are returned.
      - name: entityNames
        in: query
        schema:
          type: array
          items:
            type: string
          uniqueItems: true
        description: Filters the Submission Data records by entity name. Must match schema names in the Submission's dictionary. If not provided, all entity names are returned.
      - name: fileId
        in: query
        required: false
        schema:
          type: integer
        description: An optional query parameter used to specify the file ID within the submission to be retrieved.
      - $ref: '#/components/parameters/query/Page'
      - $ref: '#/components/parameters/query/PageSize'
    responses:
      200:
        description: Paginated Submission Data records
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmissionDetailsResult'
      400:
        description: The request is invalid, the Submission was not found, or an entity name is not in its dictionary
        content:
          application/json:
            schema:
              $ref: '#/components/responses/Error'
      401:
        $ref: '#/components/responses/UnauthorizedError'
      403:
        $ref: '#/components/responses/Forbidden'
      500:
        $ref: '#/components/responses/ServerError'
      503:
        $ref: '#/components/responses/ServiceUnavailableError'

  delete:
    summary: Remove a file and all of its records from an Active Submission. The Active Submission is then validated again in the background.
    description: Records can't be removed individually. To remove or change some of a file's records, remove the file and upload a corrected one, so each record's line number always matches its line in the submitted file.
    tags:
      - Submission
    parameters:
      - $ref: '#/components/parameters/path/SubmissionId'
      - name: fileId
        in: query
        required: true
        schema:
          type: integer
        description: The ID of the file to remove from the Submission, along with all of its records.
    responses:
      200:
        description: Removal accepted. Validation of the Active Submission runs in the background.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteSubmissionEntityResult'
      400:
        description: >
          The request is invalid, the Submission or the file was not found, or the file is system-generated and can't
          be removed by the user
        content:
          application/json:
            schema:
              $ref: '#/components/responses/Error'
      401:
        $ref: '#/components/responses/UnauthorizedError'
      403:
        $ref: '#/components/responses/Forbidden'
      409:
        $ref: '#/components/responses/StatusConflict'
      500:
        $ref: '#/components/responses/ServerError'
      503:
        $ref: '#/components/responses/ServiceUnavailableError'

/submission/{submissionId}/errors/summary:
  get:
    summary: Fetch a dashboard-style summary of a single file's validation errors within a Submission
    tags:
      - Submission
    parameters:
      - $ref: '#/components/parameters/path/SubmissionId'
      - name: fileId
        in: query
        required: true
        schema:
          type: integer
        description: The ID of the file within the Submission to summarize errors for
    responses:
      200:
        description: Error summary for the file
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmissionErrorsSummaryResult'
      400:
        $ref: '#/components/responses/BadRequest'
      401:
        $ref: '#/components/responses/UnauthorizedError'
      404:
        $ref: '#/components/responses/NotFound'
      500:
        $ref: '#/components/responses/ServerError'
      503:
        $ref: '#/components/responses/ServiceUnavailableError'

/submission/{submissionId}/errors/download:
  get:
    summary: Download a single file's validation errors within a Submission as a CSV or TSV file
    tags:
      - Submission
    parameters:
      - $ref: '#/components/parameters/path/SubmissionId'
      - name: fileId
        in: query
        required: true
        schema:
          type: integer
        description: The ID of the file within the Submission to download errors for
      - name: fileType
        in: query
        required: false
        schema:
          type: string
          enum: [csv, tsv]
          default: csv
        description: The delimited format to download the error report as
    responses:
      200:
        description: The error report as an attachment
        content:
          text/csv:
            schema:
              type: string
          text/tab-separated-values:
            schema:
              type: string
      400:
        $ref: '#/components/responses/BadRequest'
      401:
        $ref: '#/components/responses/UnauthorizedError'
      404:
        $ref: '#/components/responses/NotFound'
      500:
        $ref: '#/components/responses/ServerError'
      503:
        $ref: '#/components/responses/ServiceUnavailableError'

/submission/category/{categoryId}:
  get:
    summary: Retrieve the Submissions for a category in this user session
    tags:
      - Submission
    parameters:
      - $ref: '#/components/parameters/path/CategoryId'
      - $ref: '#/components/parameters/query/Page'
      - $ref: '#/components/parameters/query/PageSize'
      - $ref: '#/components/parameters/query/OnlyActive'
      - $ref: '#/components/parameters/query/OrganizationFilter'
      - $ref: '#/components/parameters/query/Username'
    responses:
      200:
        description: List of Submissions
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListSubmissionsResult'
      400:
        $ref: '#/components/responses/BadRequest'
      401:
        $ref: '#/components/responses/UnauthorizedError'
      403:
        $ref: '#/components/responses/Forbidden'
      404:
        $ref: '#/components/responses/NotFound'
      500:
        $ref: '#/components/responses/ServerError'
      503:
        $ref: '#/components/responses/ServiceUnavailableError'

/submission/category/{categoryId}/organization/{organization}:
  get:
    summary: Get the Active Submission of the requesting user for a category and organization
    description: >
      Returns the Active Submission created by the requesting user, identified by the access token, for this category
      and organization.
    tags:
      - Submission
    parameters:
      - $ref: '#/components/parameters/path/CategoryId'
      - $ref: '#/components/parameters/path/Organization'
    responses:
      200:
        description: Active Submission of the requesting user
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmissionResult'
      400:
        $ref: '#/components/responses/BadRequest'
      401:
        $ref: '#/components/responses/UnauthorizedError'
      403:
        $ref: '#/components/responses/Forbidden'
      404:
        description: The category was not found, or the requesting user has no Active Submission for this category and organization
        content:
          application/json:
            schema:
              $ref: '#/components/responses/Error'
      500:
        $ref: '#/components/responses/ServerError'
      503:
        $ref: '#/components/responses/ServiceUnavailableError'

/submission/category/{categoryId}/commit/{submissionId}:
  post:
    summary: Commit Active Submission
    tags:
      - Submission
    parameters:
      - $ref: '#/components/parameters/path/CategoryId'
      - $ref: '#/components/parameters/path/SubmissionId'
    responses:
      200:
        description: Commit Submission Result
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommitSubmissionResult'
      400:
        description: >
          The request is invalid, the Submission was not found, it belongs to another category, or the category has no
          active dictionary
        content:
          application/json:
            schema:
              $ref: '#/components/responses/Error'
      401:
        $ref: '#/components/responses/UnauthorizedError'
      403:
        $ref: '#/components/responses/Forbidden'
      404:
        description: The category was not found
        content:
          application/json:
            schema:
              $ref: '#/components/responses/Error'
      409:
        description: >
          The Submission or one of its records is not `VALID`, the Submission changed while the commit was requested,
          or a dictionary migration is running for the category
        content:
          application/json:
            schema:
              $ref: '#/components/responses/Error'
      500:
        $ref: '#/components/responses/ServerError'
      503:
        $ref: '#/components/responses/ServiceUnavailableError'

/submission/category/{categoryId}/data:
  post:
    summary: Add new data to a submission for the specified category. Data is provided as JSON in the request body.
    tags:
      - Submission
    parameters:
      - $ref: '#/components/parameters/path/CategoryId'
      - $ref: '#/components/parameters/query/EntityName'
      - $ref: '#/components/parameters/query/Organization'
    requestBody:
      description: The JSON payload containing the data to be added to the submission
      required: true
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
    responses:
      200:
        description: >
          Request processed. Check `status`: `INVALID_SUBMISSION` means nothing was accepted, for example because the
          entity name is not in the dictionary or the Active Submission can't be changed.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubmissionResult'
      400:
        description: The request is invalid, the payload is empty, or the category has no dictionary
        content:
          application/json:
            schema:
              $ref: '#/components/responses/Error'
      401:
        $ref: '#/components/responses/UnauthorizedError'
      403:
        $ref: '#/components/responses/Forbidden'
      404:
        description: The category was not found
        content:
          application/json:
            schema:
              $ref: '#/components/responses/Error'
      413:
        $ref: '#/components/responses/ContentTooLarge'
      500:
        $ref: '#/components/responses/ServerError'
      503:
        $ref: '#/components/responses/ServiceUnavailableError'
  put:
    summary: Modifies existing data for a submission.  Data is provided as JSON in the request body.
    tags:
      - Submission
    parameters:
      - $ref: '#/components/parameters/path/CategoryId'
      - $ref: '#/components/parameters/query/EntityName'
      - $ref: '#/components/parameters/query/Organization'
    requestBody:
      description: The JSON payload containing the data to be added to the submission
      required: true
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
    responses:
      200:
        description: >
          Request processed. Check `status`: `INVALID_SUBMISSION` means nothing was accepted, for example because some
          records have no `systemId` or it was not found (see `description`).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubmissionResult'
      400:
        description: The request is invalid or the payload is empty
        content:
          application/json:
            schema:
              $ref: '#/components/responses/Error'
      401:
        $ref: '#/components/responses/UnauthorizedError'
      403:
        $ref: '#/components/responses/Forbidden'
      404:
        description: The category was not found
        content:
          application/json:
            schema:
              $ref: '#/components/responses/Error'
      413:
        $ref: '#/components/responses/ContentTooLarge'
      500:
        $ref: '#/components/responses/ServerError'
      503:
        $ref: '#/components/responses/ServiceUnavailableError'

/submission/category/{categoryId}/files:
  post:
    summary: Add new data to a submission for the specified category. An optional filename-to-entity map can be provided to control which entity each file is submitted for, enabling multiple files for the same entity and files whose names do not match the entity name.
    tags:
      - Submission
    parameters:
      - $ref: '#/components/parameters/path/CategoryId'
      - $ref: '#/components/parameters/query/Organization'
      - name: sync
        in: query
        required: false
        schema:
          type: string
          enum: [true, false]
          default: 'false'
        description: >
          Controls whether file parsing is synchronous. When `false` (default), parsing runs in the
          background and `fileResults` will be empty in the response. When `true`, the response waits
          for all files to be parsed and returns per-file results in `fileResults`.

          **Warning:** Using `sync=true` on very large batches may cause the request to time out before
          the response is returned. Monitor server logs for parse errors when using the default async mode.
    requestBody:
      description: File(s) to be added to the submission, with an optional mapping of filenames to entity names.
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required:
              - files
            properties:
              files:
                type: array
                items:
                  type: string
                  format: binary
              fileEntityMap:
                type: array
                description: Optional mapping of uploaded filenames to entity names. When provided, each file is matched to its entity using this map. When omitted, each file's name (without extension) must match an entity name in the dictionary.
                items:
                  $ref: '#/components/schemas/FilenameEntityPair'
          encoding:
            fileEntityMap:
              contentType: application/json
    responses:
      200:
        description: >
          At least one file was accepted and is being processed. `status` is `PARTIAL_SUBMISSION` when other files
          were rejected; see `batchErrors`.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitFilesResult'
      400:
        description: >
          No file was accepted. When the files were checked, the body is a `SubmitFilesResult` with `status`
          `INVALID_SUBMISSION` and the reasons in `batchErrors`. When the request itself is invalid, no files were sent,
          or the category has no dictionary, the body is an `Error`.
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/SubmitFilesResult'
                - $ref: '#/components/responses/Error'
      401:
        $ref: '#/components/responses/UnauthorizedError'
      403:
        $ref: '#/components/responses/Forbidden'
      404:
        description: The category was not found
        content:
          application/json:
            schema:
              $ref: '#/components/responses/Error'
      411:
        $ref: '#/components/responses/LengthRequired'
      413:
        $ref: '#/components/responses/ContentTooLarge'
      500:
        $ref: '#/components/responses/ServerError'
      503:
        $ref: '#/components/responses/ServiceUnavailableError'

/submission/category/{categoryId}/data/{systemId}:
  delete:
    summary: Stage the deletion of a Submitted Data record, and of the records that depend on it, on the Active Submission
    description: >
      Adds a delete of the record with this System ID, and of every record that depends on it, to the requesting user's
      Active Submission for the record's organization, opening one if needed. The Active Submission is then validated
      again in the background. The records are deleted when the Submission is committed.
    tags:
      - Submission
    parameters:
      - $ref: '#/components/parameters/path/CategoryId'
      - name: systemId
        in: path
        required: true
        schema:
          type: string
        description: The unique system ID of the data to be deleted
    responses:
      200:
        description: >
          Request processed. Check `status`: `INVALID_SUBMISSION` means nothing was staged, for example because the
          record belongs to another category or has an update pending on the Active Submission (see `description`).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteSubmittedDataResult'
      400:
        description: The request is invalid, or no Submitted Data was found with this System ID
        content:
          application/json:
            schema:
              $ref: '#/components/responses/Error'
      401:
        $ref: '#/components/responses/UnauthorizedError'
      403:
        $ref: '#/components/responses/Forbidden'
      404:
        description: The category was not found
        content:
          application/json:
            schema:
              $ref: '#/components/responses/Error'
      500:
        $ref: '#/components/responses/ServerError'
      503:
        $ref: '#/components/responses/ServiceUnavailableError'
