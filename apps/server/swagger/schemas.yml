# Descriptions of common components

components:
  responses:
    BadRequest:
      description: Error response indicating that the client's request is malformed or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/responses/Error'

    Error:
      type: object
      properties:
        error:
          type: string
          description: Error type
        message:
          type: string
          decription: Description of the error

    Forbidden:
      description: Error response indicating invalid access due to inadequate permissions
      content:
        application/json:
          schema:
            $ref: '#/components/responses/Error'

    NotFound:
      description: Requested resource could not be found
      content:
        application/json:
          schema:
            $ref: '#/components/responses/Error'

    ServerError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/responses/Error'

    ServiceUnavailableError:
      description: Error message indicating the server is currently unable to handle the request, often due to maintenance, overload, or temporary issues
      content:
        application/json:
          schema:
            $ref: '#/components/responses/Error'

    StatusConflict:
      description: Error response indicating the requested action could not be performed on the entity in its current state.
      content:
        application/json:
          schema:
            $ref: '#/components/responses/Error'

    UnauthorizedError:
      description: Access token is missing or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/responses/Error'

  schemas:
    Pagination:
      type: object
      properties:
        currentPage:
          type: number
        pageSize:
          type: number
        totalPages:
          type: number
        totalRecords:
          type: number

    ListSubmissionsResult:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        records:
          type: array
          items:
            $ref: '#/components/schemas/SubmissionResult'

    SubmissionDetailsResult:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        records:
          type: array
          items:
            $ref: '#/components/schemas/SubmissionRecord'

    SubmissionRecord:
      oneOf:
        - $ref: '#/components/schemas/SubmissionInsertRecord'
        - $ref: '#/components/schemas/SubmissionUpdateRecord'
        - $ref: '#/components/schemas/SubmissionDeleteRecord'
      discriminator:
        propertyName: actionType
        mapping:
          INSERT: '#/components/schemas/SubmissionInsertRecord'
          UPDATE: '#/components/schemas/SubmissionUpdateRecord'
          DELETE: '#/components/schemas/SubmissionDeleteRecord'

    SubmissionInsertRecord:
      allOf:
        - $ref: '#/components/schemas/SubmissionRecordBase'
        - type: object
          required:
            - actionType
            - data
          properties:
            actionType:
              type: string
              enum: ['INSERT']
            data:
              $ref: '#/components/schemas/SubmissionInsertData'

    SubmissionUpdateRecord:
      allOf:
        - $ref: '#/components/schemas/SubmissionRecordBase'
        - type: object
          required:
            - actionType
            - data
          properties:
            actionType:
              type: string
              enum: ['UPDATE']
            data:
              $ref: '#/components/schemas/SubmissionUpdateData'

    SubmissionDeleteRecord:
      allOf:
        - $ref: '#/components/schemas/SubmissionRecordBase'
        - type: object
          required:
            - actionType
            - data
          properties:
            actionType:
              type: string
              enum: ['DELETE']
            data:
              $ref: '#/components/schemas/SubmissionDeleteData'

    SubmissionInsertData:
      type: object
      description: Content of the record to insert, keyed by field name
      additionalProperties: true

    SubmissionUpdateData:
      type: object
      required:
        - systemId
        - old
        - new
      properties:
        systemId:
          type: string
          description: System ID of the Submitted Data record to update
        old:
          type: object
          description: Current values of the fields being changed, keyed by field name
          additionalProperties: true
        new:
          type: object
          description: New values of the fields being changed, keyed by field name
          additionalProperties: true

    SubmissionDeleteData:
      type: object
      required:
        - systemId
        - data
        - isValid
        - organization
      properties:
        systemId:
          type: string
          description: System ID of the Submitted Data record to delete
        data:
          type: object
          description: Content of the Submitted Data record to delete, keyed by field name
          additionalProperties: true
        isValid:
          type: boolean
          description: Whether the Submitted Data record to delete is currently valid
        organization:
          type: string
          description: Organization the Submitted Data record belongs to

    SubmissionRecordBase:
      type: object
      required:
        - entityName
        - fileId
        - id
        - state
      properties:
        entityName:
          type: string
          description: Name of the entity
        errors:
          type: array
          nullable: true
          description: Validation errors for this record. `null` when the record has no errors.
          items:
            $ref: '#/components/schemas/SubmissionRecordError'
        fileId:
          type: integer
          description: ID of the file in the submission
        id:
          type: integer
          description: ID of the record in the submission
        idFieldChange:
          type: boolean
          description: >
            `true` only on an `UPDATE` whose change touches an ID field (a field referenced by another entity's foreign key).
            This `UPDATE` is not applied itself: the records referencing it through `parentRecord` apply the change.
            It is `INVALID` when any of those records is invalid.
        parentRecord:
          type: integer
          nullable: true
          description: >
            ID of the `idFieldChange` `UPDATE` that caused this record to be staged: the `DELETE` of the original record,
            the `INSERT` of its replacement, or a foreign key `UPDATE` of a dependent record.
            `null` for any other record. Removing the parent removes this record; this record cannot be removed on its own.
        lineNumber:
          type: integer
          nullable: true
          description: >
            Line number of the record in its uploaded file, counting the header as line 1, so the first data row is line 2.
            For records submitted as JSON or created by edit and delete requests, this is the 1-based position of the record in the request.
        state:
          type: string
          description: State of the record in the submission
          enum: ['VALID', 'INVALID', 'RECEIVED']

    SubmissionRecordError:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          description: The type of error
          enum:
            - CONFLICTING_ACTION
            - INVALID_BY_FOREIGNKEY
            - INVALID_BY_RESTRICTION
            - INVALID_BY_UNIQUE
            - INVALID_BY_UNIQUE_KEY
            - INVALID_CONSEQUENCE_RECORD
            - INVALID_VALUE_TYPE
            - UNRECOGNIZED_FIELD
            - UNRECOGNIZED_VALUE
        fieldName:
          type: string
          description: The field name that the error is related to
        fieldValue:
          description: The value of the field that caused the error
        conflictingActionType:
          type: string
          enum: ['UPDATE', 'DELETE']
          description: Only for `CONFLICTING_ACTION`. The other action type staged for the same `systemId`.
        systemId:
          type: string
          description: Only for `CONFLICTING_ACTION`. The System ID that has both an `UPDATE` and a `DELETE` staged.
        invalidRecordIds:
          type: array
          items:
            type: integer
          description: Only for `INVALID_CONSEQUENCE_RECORD`. IDs of the invalid records staged as a consequence of this ID field change; their errors are on those records.
        message:
          type: string
          description: Details of the error
      additionalProperties: true

    SubmissionResult:
      type: object
      properties:
        id:
          type: number
          description: ID of the Submission
        data:
          type: object
          description: Summary of the Submission records, grouped by action type and entity name
          properties:
            inserts:
              type: object
              description: Insert records, keyed by entity name. Each entity lists one summary per file.
              additionalProperties:
                type: array
                items:
                  $ref: '#/components/schemas/SubmissionFileSummary'
            updates:
              type: object
              description: Update records, keyed by entity name. Each entity lists one summary per file.
              additionalProperties:
                type: array
                items:
                  $ref: '#/components/schemas/SubmissionFileSummary'
            deletes:
              type: object
              description: Delete records, keyed by entity name, with counts combined across files.
              additionalProperties:
                type: object
                properties:
                  errors:
                    type: integer
                    description: Number of records with errors
                  recordsCount:
                    type: integer
                    description: Number of records
            totalRecords:
              type: integer
              description: Total number of records in the submission
            errors:
              type: integer
              description: Total number of records with errors in the submission
        dictionary:
          type: object
          description: Dictionary used to validate the submission
          properties:
            name:
              type: string
            version:
              type: string
        dictionaryCategory:
          type: object
          description: Category this dictionary belongs in
          properties:
            id:
              type: number
            name:
              type: string
            alias:
              type: string
              description: Category alias. Omitted when the category has no alias.
        organization:
          type: string
          description: Organization the Submission belongs to
        status:
          type: string
          description: Status of the Submission
          enum: ['OPEN', 'VALIDATING', 'VALID', 'INVALID', 'CLOSED', 'COMMITTING', 'COMMITTED']
        createdAt:
          type: string
          description: Date and time of creation
        createdBy:
          type: string
          description: Name of user who created the submission
        updatedAt:
          type: string
          description: Date and time of latest update
        updatedBy:
          type: string
          description: Name of user who last updated the submission

    SubmissionFileSummary:
      type: object
      properties:
        batchName:
          type: string
          description: Original filename of the file in the submission
        errors:
          type: integer
          description: Number of records with errors in the file
        fileId:
          type: integer
          description: ID of the file in the submission
        recordsCount:
          type: integer
          description: Number of records in the file

    FilenameEntityPair:
      type: object
      required:
        - filename
        - entity
      properties:
        filename:
          type: string
          description: The original filename of the uploaded file.
          example: donor123_specimens.tsv
        entity:
          type: string
          description: The entity name this file contains data for.
          example: specimen

    BatchError:
      type: object
      properties:
        message:
          type: string
          description: A message describing the error
        type:
          type: string
          description: The type of error
          enum:
            - INCORRECT_SECTION
            - INVALID_FILE_EXTENSION
            - INVALID_FILE_NAME
            - MISSING_REQUIRED_HEADER
            - MULTIPLE_TYPED_FILES
            - TSV_PARSING_FAILED
            - UNRECOGNIZED_HEADER
        batchName:
          type: array
          description: List of batch names causing error
          items:
            type: string

    CategoryDetails:
      type: object
      properties:
        alias:
          type: string
          description: >-
            Optional alias for the category, usable in place of the numeric id anywhere a
            categoryId is accepted. Not set if none was assigned at creation.
        id:
          type: number
          description: ID of the Category
        dictionary:
          type: object
          description: Dictionary used to validate the submission
          properties:
            name:
              type: string
            version:
              type: string
        name:
          type: string
          description: Name of the Category
        organizations:
          type: array
          items:
            type: string
            description: List of organizations on this category
        createdAt:
          type: string
          description: Date and time of creation
        createdBy:
          type: string
          description: User name who created the submission
        updatedAt:
          type: string
          description: Date and time of latest update
        updatedBy:
          type: string
          description: User name who last updated the submission

    CategorySummary:
      type: object
      properties:
        alias:
          type: string
          description: Optional alias for the category. Not set if none is assigned.
        id:
          type: number
          description: ID of the Category
        name:
          type: string
          description: Name of the Category

    ChangeHistorySummaryResult:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        records:
          type: array
          items:
            $ref: '#/components/schemas/ChangeHistoryRecord'

    ChangeHistoryRecord:
      type: object
      properties:
        entityName:
          type: string
          description: Name of the Entity
        event:
          type: string
          description: Type of event
          enum: ['UPDATE', 'DELETE', 'MIGRATION']
        errors:
          type: array
          description: List of validation errors related to the change if applicable
          items:
            $ref: '#/components/schemas/ValidationError'
        dataDiff:
          type: object
          description: Captures the state of the data before the change as `old` and after the change as `new`
        newIsValid:
          type: boolean
          description: New  data isValid value
        oldIsValid:
          type: boolean
          description: Old data isValid value
        organization:
          type: string
          description: Name of the Organization
        submissionId:
          type: string
          description: Submission ID the change belongs to
        systemId:
          type: string
          description: The unique identifier of the record changed
        createdAt:
          type: string
          description: Date and time of creation
        createdBy:
          type: string
          description: User name who updated the submission

    CommitSubmissionResult:
      required:
        - status
        - dictionary
      type: object
      properties:
        status:
          type: string
          description: Result of Commiting Submission
          enum: ['PROCESSING']
        dictionary:
          type: object
          description: The dictionary used to validate the submission
          properties:
            name:
              type: string
            version:
              type: string
        processedEntities:
          type: array
          description: Names of the entities that will be processed
          items:
            type: string

    CreateSubmissionResult:
      required:
        - status
        - description
      type: object
      properties:
        description:
          type: string
          description: Description of uploading Submission files
        status:
          type: string
          description: Result of uploading Submission files
          enum: ['PROCESSING', 'INVALID_SUBMISSION']
        submissionId:
          type: string
          description: ID of the Submission

    DeleteSubmissionResult:
      required:
        - status
        - description
      type: object
      properties:
        description:
          type: string
          description: Description of closing the Submission
        status:
          type: string
          description: Result of closing the Submission
          enum: ['CLOSED']
        submissionId:
          type: string
          description: ID of the Submission

    DeleteSubmissionEntityResult:
      required:
        - status
        - description
      type: object
      properties:
        description:
          type: string
          description: Description of deleting partially Submission data
        status:
          type: string
          description: Result of deleting Submission data
          enum: ['PROCESSING']
        submissionId:
          type: integer
          description: ID of the Submission

    GetSubmittedDataResult:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        records:
          type: array
          items:
            $ref: '#/components/schemas/SubmittedDataRecord'

    Health:
      type: object
      properties:
        uptime:
          type: string
          description: Number of seconds the current Node.js process has been running
        message:
          type: string
          description: Status of the service
        timestamp:
          type: string
          description: Current system's time in milliseconds since the Unix epoch

    ListAllCategories:
      type: array
      items:
        $ref: '#/components/schemas/CategorySummary'

    ListMigrationRecordsResult:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        records:
          type: array
          items:
            $ref: '#/components/schemas/MigrationChangeHistoryRecord'

    ListMigrationsResult:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        records:
          type: array
          items:
            $ref: '#/components/schemas/MigrationResult'

    MigrationChangeHistoryRecord:
      type: object
      properties:
        entityName:
          type: string
          description: Name of the Entity
        errors:
          type: array
          description: List of validation errors related to the change if applicable
          items:
            $ref: '#/components/schemas/ValidationError'
        dataDiff:
          type: object
          description: Captures the state of the data before the change as `old` and after the change as `new`
        newIsValid:
          type: boolean
          description: New  data isValid value
        oldIsValid:
          type: boolean
          description: Old data isValid value
        organization:
          type: string
          description: Name of the Organization
        systemId:
          type: string
          description: The unique identifier of the record changed
        createdAt:
          type: string
          description: Date and time of creation
        createdBy:
          type: string
          description: User name who updated the submission

    MigrationResult:
      type: object
      properties:
        id:
          type: number
          description: ID of the Migration
        category:
          type: object
          description: Category this dictionary belongs in
          properties:
            id:
              type: number
            name:
              type: string
        fromDictionary:
          type: object
          description: Previous Dictionary used in this category
          properties:
            name:
              type: string
            version:
              type: string
        toDictionary:
          type: object
          description: New Dictionary used in this category
          properties:
            name:
              type: string
            version:
              type: string
        submissionId:
          type: number
          description: ID of the Submission used for the migration
        invalidRecords:
          type: number
          description: Number of invalid records during the migration
        status:
          type: string
          description: Status of the Migration
          enum: ['IN-PROGRESS', 'COMPLETED', 'FAILED']
        retries:
          type: number
          description: Number of times the migration has run. When a migration fails, it can be retried by registering again the same dictionary.
        createdAt:
          type: string
          description: Date and time of creation
        createdBy:
          type: string
          description: User name who created the migration
        updatedAt:
          type: string
          description: Date and time of latest update
        updatedBy:
          type: string
          description: User name who last updated the migration

    RegisterDictionaryResult:
      type: object
      properties:
        alias:
          type: string
          description: Optional alias for the category. Not present if none was assigned.
        categoryId:
          type: number
          description: ID of the Category
        categoryName:
          type: string
          description: Name of the Category
        dictionary:
          type: object
          description: Schema of the Dictionary
        name:
          type: string
          description: Name of the Dictionary
        version:
          type: string
          description: Version of the Dictionary
        migrationId:
          type: string
          description: ID of the Migration if applicable
          allowEmptyValue: true

    SubmittedDataRecord:
      type: object
      properties:
        data:
          type: object
          description: Content of the record in JSON format
        entityName:
          type: string
        isValid:
          type: boolean
        organization:
          type: string
        systemId:
          type: string

    ValidationError:
      type: object
      required:
        - index
        - errorType
        - fieldName
      properties:
        fieldName:
          type: string
          description: The field name that the error is related to
        info:
          type: object
          description: Contains context information related to the error
          properties:
            value:
              type: array
              description: The faulty value
              items:
                type: string
        index:
          type: number
          format: integer
          description: Index of the row for this error (starting from 0)
        errorType:
          type: string
          description: The type of error
          enum:
            - INVALID_BY_RANGE
            - INVALID_BY_REGEX
            - INVALID_BY_SCRIPT
            - INVALID_ENUM_VALUE
            - INVALID_FIELD_VALUE_TYPE
            - MISSING_REQUIRED_FIELD
            - UNRECOGNIZED_FIELD
        message:
          type: string
          description: Details of the error
