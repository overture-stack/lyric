components:
  parameters:
    path:
      CategoryId:
        name: categoryId
        in: path
        required: true
        schema:
          type: string
        description: Numeric ID or alias of the category to which the data belongs.
      EntityName:
        description: The name of the Entity
        name: entityName
        in: path
        schema:
          type: string
        required: true
      MigrationId:
        name: migrationId
        in: path
        required: true
        schema:
          type: string
        description: The ID of the Migration
      Organization:
        name: organization
        in: path
        required: true
        schema:
          type: string
      SubmissionId:
        name: submissionId
        in: path
        required: true
        schema:
          type: string
          pattern: '^\d+$'
        description: The ID of the Submission. Digits only.
    query:
      EntityName:
        description: The name of the Entity
        name: entityName
        in: query
        schema:
          type: string
        required: true
      ForceDeleteSubmission:
        description: Optional query parameter to force the deletion of a submission. Default value is false
        name: force
        in: query
        schema:
          type: boolean
        required: false
      OnlyActive:
        description: >-
          Optional query parameter to filter results to include only active submissions (OPEN, VALIDATING, VALID,
          INVALID, COMMITTING). Default value is false. Cannot be `true` when `status` is given
        name: onlyActive
        in: query
        schema:
          type: boolean
        required: false
      Organization:
        description: The name of the Organization
        name: organization
        in: query
        schema:
          type: string
        required: true
      OrganizationFilter:
        description: >-
          Optional query parameter to filter results to include only submissions associated to the given
          organizations. Repeat the parameter to match several organizations
          (`?organization=org-a&organization=org-b`). By default, returns submissions from all organizations
        name: organization
        in: query
        schema:
          type: array
          items:
            type: string
        required: false
      Page:
        name: page
        in: query
        required: false
        schema:
          type: integer
        description: Optional query parameter to specify the page number of the results. Default value is 1
      PageSize:
        name: pageSize
        in: query
        required: false
        schema:
          type: integer
        description: Optional query parameter to specify the number of results per page. Default value is 20
      SubmissionSort:
        name: sort
        in: query
        required: false
        schema:
          type: string
          default: '-createdAt'
          example: 'status,-updatedAt'
        description: >-
          Optional query parameter to set the order of the results: comma-separated field names, each sorted
          ascending unless prefixed with `-` for descending. Each field may appear once, and field names are
          case-sensitive. Allowed fields: `createdAt`, `createdBy`, `id`, `organization`, `status`, `updatedAt`,
          `updatedBy`. `status` sorts in lifecycle order (OPEN, VALIDATING, VALID, INVALID, CLOSED, COMMITTING,
          COMMITTED), not alphabetically. Submissions with no value for a field sort after the others in ascending
          order and before them in descending order. Submissions that are equal on every requested field are ordered
          by descending `id`. Default value is `-createdAt` (newest first)
      SubmissionStatusFilter:
        name: status
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            enum: ['OPEN', 'VALIDATING', 'VALID', 'INVALID', 'CLOSED', 'COMMITTING', 'COMMITTED']
        description: >-
          Optional query parameter to filter results to include only submissions in the given statuses, matched in any
          case. Repeat the parameter to match several statuses (`?status=OPEN&status=VALID`). Cannot be combined with
          `onlyActive=true`. By default, returns submissions in all statuses
      Username:
        name: username
        in: query
        required: false
        schema:
          type: string
        description: Optional query parameter to filter results to include only submissions created by a specific user. By default, returns submissions from all users
      Value:
        name: value
        in: query
        required: true
        schema:
          type: string
        description: The value to search for in the specified field
      View:
        name: view
        in: query
        required: false
        schema:
          type: string
          enum: ['flat', 'compound']
        description: Optional query parameter to define the data format. Choose 'flat' for a simple, single-level collection of records, or 'compound' for a nested, schema-centric structure. The default value is 'flat'
